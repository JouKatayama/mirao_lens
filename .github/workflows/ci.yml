name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  graph:
    # The relationship graph's Neo4j projection (ADR-0011), tested against a
    # real Neo4j. The password exists only inside this throwaway container.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/miraio-ci-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p miraio-ci-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Neo4j graph projection
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USERNAME: neo4j
          NEO4J_TEST_PASSWORD: miraio-ci-only
          NEO4J_TEST_REQUIRED: "1"
        run: pnpm --filter @miraio/db exec vitest run src/graph

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Recreate database from migrations and seed
        run: pnpm db:reset

      - name: Lint database schema
        run: pnpm db:lint

      - name: Test database contracts and RLS
        run: pnpm db:test

      - name: Verify generated database types
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db/src/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
